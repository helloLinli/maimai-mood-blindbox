    <rect x="0.5" y="0.5" width="329" height="269" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.9"/>
    <!-- 碳纤维质感 -->
    <g opacity="0.05" stroke="#2d3436" stroke-width="2">
      <path d="M0 30L330 0M0 90L330 60M0 150L330 120M0 210L330 180M0 270L330 240"/>
      <path d="M0 240L330 270M0 180L330 210M0 120L330 150M0 60L330 90M0 0L330 30"/>
    </g>
    <!-- 屏幕 -->
    <rect x="18" y="18" width="294" height="172" rx="10" fill="url(#screendark)"/>
    <rect x="18" y="18" width="294" height="172" rx="10" fill="none" stroke="#1b1f21" stroke-width="2"/>
    <!-- 扫描线 -->
    <g opacity="0.35" fill="#000000">
      <rect x="18" y="22" width="294" height="2"/><rect x="18" y="30" width="294" height="2"/>
      <rect x="18" y="38" width="294" height="2"/><rect x="18" y="46" width="294" height="2"/>
      <rect x="18" y="54" width="294" height="2"/><rect x="18" y="62" width="294" height="2"/>
      <rect x="18" y="70" width="294" height="2"/><rect x="18" y="78" width="294" height="2"/>
      <rect x="18" y="86" width="294" height="2"/><rect x="18" y="94" width="294" height="2"/>
      <rect x="18" y="102" width="294" height="2"/><rect x="18" y="110" width="294" height="2"/>
      <rect x="18" y="118" width="294" height="2"/><rect x="18" y="126" width="294" height="2"/>
      <rect x="18" y="134" width="294" height="2"/><rect x="18" y="142" width="294" height="2"/>
      <rect x="18" y="150" width="294" height="2"/><rect x="18" y="158" width="294" height="2"/>
      <rect x="18" y="166" width="294" height="2"/><rect x="18" y="174" width="294" height="2"/>
      <rect x="18" y="182" width="294" height="2"/>
    </g>
    <text x="36" y="44" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11"
          letter-spacing="1.6" fill="#a8b2d1">MOOD ENGINE</text>
    <circle cx="292" cy="40" r="5" fill="#22c55e" opacity="0.3"/>
    <circle cx="292" cy="40" r="3.4" fill="#22c55e"/>
    <text x="36" y="84" font-family="'Inter','PingFang SC','Microsoft YaHei',sans-serif" font-size="30"
          font-weight="800" fill="#ffffff">加班</text>
    <text x="36" y="106" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11"
          fill="#22c55e">EO-01 · 能量续航</text>
    <rect x="36" y="120" width="258" height="8" rx="4" fill="#000000" opacity="0.55"/>
    <rect x="36" y="120" width="238" height="8" rx="4" fill="#22c55e" opacity="0.85"/>
    <text x="36" y="152" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11"
          fill="#a8b2d1">合法组合 2219</text>
    <text x="36" y="172" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11"
          fill="#a8b2d1">SEED 26434542</text>
    <!-- 散热槽 -->
    <g fill="#d1d9e6">
      <rect x="250" y="204" width="4" height="16" rx="2"/><rect x="258" y="204" width="4" height="16" rx="2"/>
      <rect x="266" y="204" width="4" height="16" rx="2"/><rect x="274" y="204" width="4" height="16" rx="2"/>
    </g>
    <!-- 出纸口 + 旋钮 -->
    <rect x="18" y="236" width="294" height="6" rx="3" fill="#c9d0dc"/>
    <g fill="#dfe4ec">
      <circle cx="290" cy="254" r="9"/><circle cx="258" cy="254" r="9"/><circle cx="226" cy="254" r="9"/>
    </g>
  </g>

  <!-- 从出纸口吐出的热敏纸 -->
  <g transform="translate(742,318) rotate(-1.5)">
    <rect x="6" y="8" width="286" height="96" rx="4" fill="#babecc" opacity="0.85"/>
    <rect x="0" y="0" width="286" height="96" rx="4" fill="#f7f6f2"/>
    <rect x="0" y="0" width="286" height="96" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.8"/>
    <text x="18" y="30" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12"
          fill="#2d3436">SEED 26434542 · 同一天同一心情结果一致</text>
    <text x="18" y="52" font-family="'Inter','PingFang SC','Microsoft YaHei',sans-serif" font-size="15"
          fill="#2d3436">先让胃亮起来，剩下的交给明天九点半。</text>
    <text x="18" y="78" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="18"
          font-weight="700" fill="#ff4757">#M3992</text>
    <g fill="#2d3436">
      <rect x="186" y="64" width="2" height="20"/><rect x="191" y="64" width="1" height="20"/>
      <rect x="195" y="64" width="2" height="20"/><rect x="200" y="64" width="1" height="20"/>
      <rect x="204" y="64" width="2" height="20"/><rect x="209" y="64" width="1" height="20"/>
      <rect x="213" y="64" width="2" height="20"/><rect x="218" y="64" width="1" height="20"/>
      <rect x="222" y="64" width="2" height="20"/><rect x="227" y="64" width="1" height="20"/>
      <rect x="231" y="64" width="2" height="20"/><rect x="236" y="64" width="1" height="20"/>
      <rect x="240" y="64" width="2" height="20"/><rect x="245" y="64" width="1" height="20"/>
      <rect x="249" y="64" width="2" height="20"/>
