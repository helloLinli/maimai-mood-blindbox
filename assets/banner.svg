<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img"
     aria-label="麦麦心情盲盒 · 小票诗">
  <defs>
    <!-- 光源固定在左上 45°，因此高光在左上、投影在右下 -->
    <radialGradient id="hl" cx="6%" cy="-8%" r="78%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screendark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d3436"/>
      <stop offset="100%" stop-color="#242a2c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="440" fill="#e0e5ec"/>
  <rect width="1200" height="440" fill="url(#hl)"/>

  <!-- 蓝图底纹 -->
  <g opacity="0.07" stroke="#636e72" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M0 360H1200M0 420H1200"/>
    <path d="M60 0V440M180 0V440M300 0V440M420 0V440M540 0V440M660 0V440M780 0V440M900 0V440M1020 0V440M1140 0V440"/>
  </g>

  <!-- 四角螺丝 -->
  <g fill="none">
    <circle cx="26" cy="26" r="4" fill="#c9d0dc"/><circle cx="26" cy="26" r="2" fill="#a3b1c6"/>
    <circle cx="1174" cy="26" r="4" fill="#c9d0dc"/><circle cx="1174" cy="26" r="2" fill="#a3b1c6"/>
    <circle cx="26" cy="414" r="4" fill="#c9d0dc"/><circle cx="26" cy="414" r="2" fill="#a3b1c6"/>
    <circle cx="1174" cy="414" r="4" fill="#c9d0dc"/><circle cx="1174" cy="414" r="2" fill="#a3b1c6"/>
  </g>

  <!-- 状态 LED + mono 标签 -->
  <circle cx="78" cy="66" r="9" fill="#22c55e" opacity="0.25"/>
  <circle cx="78" cy="66" r="6" fill="#22c55e"/>
  <text x="96" y="71" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13"
        letter-spacing="2.4" fill="#4a5568">MOOD → BLINDBOX → RECEIPT</text>

  <!-- 标题：深色文字 + 下方 1px 白色高光，模拟浮雕 -->
  <text x="76" y="166" font-family="'Inter','PingFang SC','Microsoft YaHei',sans-serif" font-size="58"
        font-weight="800" letter-spacing="-1.6" fill="#ffffff" opacity="0.9">麦麦心情盲盒</text>
  <text x="76" y="165" font-family="'Inter','PingFang SC','Microsoft YaHei',sans-serif" font-size="58"
        font-weight="800" letter-spacing="-1.6" fill="#2d3436">麦麦心情盲盒</text>

  <text x="78" y="222" font-family="'Inter','PingFang SC','Microsoft YaHei',sans-serif" font-size="38"
        font-weight="800" letter-spacing="1" fill="#d92b3f">· 小票诗 ·</text>

  <text x="78" y="268" font-family="'Inter','PingFang SC','Microsoft YaHei',sans-serif" font-size="19"
        fill="#4a5568">说出此刻心情，AI 开一盒麦当劳，送你一张会说话的情绪小票。</text>

  <!-- 两块物理标签牌（用偏移矩形模拟双侧光源阴影） -->
  <g>
    <rect x="79" y="303" width="356" height="46" rx="23" fill="#babecc" opacity="0.75"/>
    <rect x="73" y="297" width="356" height="46" rx="23" fill="#ffffff"/>
    <rect x="76" y="300" width="356" height="46" rx="23" fill="#e0e5ec"/>
    <text x="100" y="329" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="14"
          fill="#2d3436">麦当劳 MCP · 真实菜单 / 营养 / 价格</text>

    <rect x="467" y="303" width="278" height="46" rx="23" fill="#babecc" opacity="0.75"/>
    <rect x="461" y="297" width="278" height="46" rx="23" fill="#ffffff"/>
    <rect x="464" y="300" width="278" height="46" rx="23" fill="#e0e5ec"/>
    <text x="488" y="329" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="14"
          fill="#2d3436">确定性开盒 · 结果可复现</text>
  </g>

  <!-- 右侧：机型外壳 + 屏幕 + 出纸口 -->
  <g transform="translate(796,54)">
    <!-- 外壳投影 -->
    <rect x="10" y="12" width="330" height="270" rx="26" fill="#babecc" opacity="0.8"/>
    <rect x="-8" y="-8" width="330" height="270" rx="26" fill="#ffffff" opacity="0.9"/>
    <!-- 外壳 -->
